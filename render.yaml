services:
  - type: web
    name: industrial-ai-inspector
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
